<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>정수의 탑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e4e7ee;--panel:#f3f4f8;--panel2:#dce0ea;--line:#bfc5d4;--ink:#1c2130;--muted:#586075;
  --gold:#8f6a12;--hp:#b73c35;--ep:#2c6aa8;--good:#377a3c;--accent:#4f40a3;--accent-ink:#fff;--shield:#4d7f96;
  --g1:#8a939a;--g2:#5e9a4c;--g3:#2f8f92;--g4:#3f6fc0;--g5:#7654c2;--g6:#ad469f;--g7:#c4433e;--g8:#cf7b27;--g9:#c9a42a;--g10:#1a9fb8;--g11:#d8408a;--g12:#3a3050;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#161a26;--panel:#1f2537;--panel2:#293047;--line:#394260;--ink:#ebe6d8;--muted:#9aa1b7;
    --gold:#dcb660;--hp:#d95f58;--ep:#62a3de;--good:#7dc070;--accent:#8f7fe6;--accent-ink:#12101f;--shield:#7fb4cc;
    --g1:#a4acb1;--g2:#7fbb6c;--g3:#4fb5b7;--g4:#6a95e0;--g5:#9c7ce6;--g6:#d06cc2;--g7:#e0625c;--g8:#e89a48;--g9:#ecc94f;--g10:#3cc4dc;--g11:#f06aa8;--g12:#d8d0ff;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161a26;--panel:#1f2537;--panel2:#293047;--line:#394260;--ink:#ebe6d8;--muted:#9aa1b7;
  --gold:#dcb660;--hp:#d95f58;--ep:#62a3de;--good:#7dc070;--accent:#8f7fe6;--accent-ink:#12101f;--shield:#7fb4cc;
  --g1:#a4acb1;--g2:#7fbb6c;--g3:#4fb5b7;--g4:#6a95e0;--g5:#9c7ce6;--g6:#d06cc2;--g7:#e0625c;--g8:#e89a48;--g9:#ecc94f;--g10:#3cc4dc;--g11:#f06aa8;--g12:#d8d0ff;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:14px 14px 48px}
h1,h2,h3,.disp{font-family:"Gowun Batang","Nanum Myeongjo","AppleMyungjo",serif;font-weight:700;margin:0}
h1{font-size:2.6rem;line-height:1.1;letter-spacing:-.01em}
h2{font-size:1.45rem;line-height:1.25}
h3{font-size:1.1rem;line-height:1.3}
p{margin:.4em 0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.gold{color:var(--gold)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.stack>*+*{margin-top:12px}
.btn{font:inherit;font-size:.95rem;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;text-align:left;line-height:1.35}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:.85rem;border-radius:8px}
.btn.danger{color:var(--hp)}
button:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.sect{margin-top:22px}
.sect>h3{margin-bottom:8px}

/* home */
.hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end;margin:18px 0 20px}
.hero p{max-width:30em}
.tower{display:flex;flex-direction:column;gap:3px;width:92px}
.tower .fl{position:relative;height:22px;border:1px solid var(--line);border-radius:3px;background:var(--panel);font-size:.72rem;color:var(--muted);display:flex;align-items:center;padding:0 6px;justify-content:space-between}
.tower .fl.done{background:color-mix(in srgb,var(--accent) 22%,var(--panel));color:var(--ink)}
.tower .fl.king{height:30px;border-radius:14px 14px 3px 3px;border-color:var(--gold);color:var(--gold);font-weight:600}
.tower .fl.cp::after{content:"";position:absolute;left:-9px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--good)}
.tower .fl.here{outline:2px solid var(--gold);outline-offset:1px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.kv b{display:block;font-family:"Gowun Batang",serif;font-size:1.3rem}
.kv span{font-size:.8rem;color:var(--muted)}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.menu .btn.primary{grid-column:1/-1;font-size:1.1rem;padding:14px}
.menu .btn small{display:block;color:inherit;opacity:.72;font-weight:400;font-size:.8rem}

/* gems */
.gem{--gc:var(--g1);display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;flex:none;position:relative}
.gem::before{content:"";position:absolute;inset:3px;transform:rotate(45deg);background:var(--gc);border-radius:3px;box-shadow:inset 0 0 0 2px color-mix(in srgb,#fff 30%,transparent)}
.gem i{position:relative;font-style:normal;font-size:.68rem;font-weight:700;color:#fff}
.gem.empty::before{background:transparent;border:1.5px dashed var(--line);box-shadow:none}

/* run header */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);padding:8px 0 10px;border-bottom:1px solid var(--line);margin:-14px 0 12px}
.hud .top{display:flex;gap:10px;align-items:baseline;justify-content:space-between}
.hud .floor{font-family:"Gowun Batang",serif;font-size:1.5rem;font-weight:700}
.hud .res{display:flex;gap:12px;font-size:.85rem;color:var(--muted);flex-wrap:wrap}
.hud .res b{color:var(--ink);font-weight:600}
.prog{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;margin-top:6px}
.prog i{height:5px;border-radius:2px;background:var(--panel2)}
.prog i.done{background:var(--accent)}
.prog i.now{background:var(--gold)}
.prog i.king{background:color-mix(in srgb,var(--gold) 40%,var(--panel2))}
.bar{height:10px;background:var(--panel2);border-radius:5px;overflow:hidden;position:relative}
.bar>i{display:block;height:100%;background:var(--hp);transition:width .25s}
.bar.ep>i{background:var(--ep)}
.bar .sh{position:absolute;top:0;right:0;height:100%;background:repeating-linear-gradient(45deg,var(--shield) 0 3px,transparent 3px 6px)}
.hprow{display:flex;gap:8px;align-items:center;font-size:.85rem;margin-top:6px}
.hprow .bar{flex:1}

/* choices */
.choices{display:grid;gap:10px}
.choice{display:block;width:100%;padding:14px 16px;border-radius:14px;border-left:5px solid var(--line)}
.choice .t{font-family:"Gowun Batang",serif;font-size:1.2rem;font-weight:700;display:block}
.choice .d{display:block;color:var(--muted);font-size:.88rem;margin-top:2px}
.choice.battle{border-left-color:var(--hp)}
.choice.unknown{border-left-color:var(--accent)}
.choice.gold{border-left-color:var(--gold)}
.choice.exchange{border-left-color:var(--good)}
.choice.boss{border-left-color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,var(--panel2))}
.tag{display:inline-block;font-size:.75rem;padding:1px 7px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);margin:2px 3px 0 0}
.tag.warn{color:var(--hp);border-color:color-mix(in srgb,var(--hp) 50%,var(--line))}
.tag.on{color:var(--good);border-color:color-mix(in srgb,var(--good) 55%,var(--line))}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}

/* combat */
.unit{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.unit.enemy.boss{border-color:var(--gold)}
.unit .nm{display:flex;align-items:center;gap:8px}
.unit .nm h3{font-size:1.2rem}
.statuses{margin-top:6px;min-height:1.2em}
.intent{margin-top:10px;padding:8px 10px;border-radius:10px;background:var(--panel2);font-size:.9rem}
.intent b{font-weight:600}
.intent.danger{background:color-mix(in srgb,var(--hp) 18%,var(--panel2))}
.order{display:flex;gap:4px;align-items:center;margin:10px 0;font-size:.8rem;color:var(--muted)}
.order i{font-style:normal;padding:2px 8px;border-radius:6px;background:var(--panel2);color:var(--ink)}
.order i.p{background:color-mix(in srgb,var(--accent) 25%,var(--panel2))}
.order i.e{background:color-mix(in srgb,var(--hp) 20%,var(--panel2))}
.pips{display:flex;gap:3px}
.pips i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ep)}
.pips i.on{background:var(--ep)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.actions .btn small{display:block;font-size:.76rem;color:var(--muted)}
.actions .btn.primary small{color:inherit;opacity:.8}
.log{margin-top:12px;font-size:.84rem;max-height:210px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.log div{padding:2px 0;border-bottom:1px dashed color-mix(in srgb,var(--line) 60%,transparent)}
.log div:first-child{color:var(--ink);font-weight:500}
.log div:not(:first-child){color:var(--muted)}

/* essences */
.slots{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.slot{flex:1 1 140px;min-height:54px;border:1.5px dashed var(--line);border-radius:12px;padding:8px 10px;display:flex;gap:8px;align-items:center;font-size:.9rem}
.slot.filled{border-style:solid;background:var(--panel)}
.ess{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start}
.ess.eq{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.ess .lines{font-size:.85rem;color:var(--muted);margin:3px 0 0;padding-left:1em}
.ess .lines li{margin:1px 0}
.esslist{display:grid;gap:8px}
.syn{font-size:.88rem;padding:8px 10px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
.syn.on{border-color:var(--good)}

/* upgrades */
.upg{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.lv{display:flex;gap:3px;margin-top:4px}
.lv i{width:14px;height:5px;border-radius:2px;background:var(--panel2)}
.lv i.on{background:var(--accent)}

/* modal & toast */
.modal{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,#000 45%,transparent);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));border:1px solid var(--line)}
@media (min-width:760px){.modal{align-items:center}.sheet{border-radius:18px;max-height:84%}}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;display:grid;gap:6px;width:min(92%,440px)}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:.9rem}
table{border-collapse:collapse;width:100%;font-size:.86rem}
td,th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-weight:600;color:var(--muted)}
.tblwrap{overflow-x:auto}
.debug{margin-top:16px;font-size:.78rem;font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--panel);border:1px dashed var(--muted);border-radius:10px;padding:8px 10px;max-height:220px;overflow:auto;color:var(--muted)}
textarea{width:100%;min-height:90px;font:inherit;font-size:.8rem;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px}
.loot{font-size:1rem}
.loot li{margin:2px 0}
.big{font-family:"Gowun Batang",serif;font-size:3rem;line-height:1}
@media (max-width:420px){h1{font-size:2.1rem}.hero{grid-template-columns:1fr 78px}.tower{width:78px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* choice delay */
.choices.busy .btn:not(.picked){opacity:.35;pointer-events:none}
.choice.picked{border-color:var(--gold);border-left-color:var(--gold)}
.choice .wait{display:block;margin-top:8px;font-size:.85rem;color:var(--muted)}
.choice .wait::after{content:"";display:block;height:3px;margin-top:6px;background:var(--gold);border-radius:2px;width:0;animation:fillbar var(--dl,900ms) linear forwards}
@keyframes fillbar{to{width:100%}}
.gtabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.gh{margin:14px 0 4px;font-size:.9rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.trait{font-size:.8rem;margin-top:3px}
.trait b{font-weight:600}
.charbar{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.upg.cur{border-color:var(--gold)}
.say{margin:8px 0;padding:8px 12px;border-left:3px solid var(--gold);background:var(--panel2);border-radius:0 10px 10px 0;font-family:"Gowun Batang",serif;font-size:.92rem}
body.in-abyss{--bg:#130e1d;--panel:#1c1530;--panel2:#261d3e;--line:#3c3060;--ink:#ece6ff;--muted:#a79cc4;background:radial-gradient(circle at 50% -20%,#2b1b4a,#130e1d 70%) fixed;color:var(--ink)}
.abyss-band{margin-top:6px;padding:6px 10px;border-radius:8px;background:#2a1a48;color:#e4d8ff;font-size:.8rem;border:1px solid #5a3a9a}
.bintro.abyssi{background:radial-gradient(circle at 50% 40%,#2a1a48,#0c0814 75%);color:#efe8ff}
.bintro.abyssi .bi-name small{color:#b8a8e0}
.bintro.rifti{background:radial-gradient(circle at 50% 45%,#3a1a5a,#08050e 75%)}
.frag{border-left:3px solid var(--gold)}
.story{font-family:"Gowun Batang",serif;line-height:1.75;margin:.6em 0}
.bi-quote{font-family:"Black Han Sans","IBM Plex Sans KR",sans-serif;font-size:1rem}
.bintro{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer;overflow:hidden;
  background:linear-gradient(180deg,#f7f9fc,#e9eef6);color:#1f2433;animation:biIn .45s ease-out;padding:env(safe-area-inset-top,0) 24px env(safe-area-inset-bottom,0)}
.bintro::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(255,255,255,.35) 0 2px,transparent 2px 6px);pointer-events:none}
.bintro .emb{position:absolute;left:50%;top:48%;width:min(125vw,86vh);height:auto;transform:translate(-50%,-50%);animation:biEmb 1.6s ease-out both}
.bi-motto{position:relative;font-family:"Black Han Sans","IBM Plex Sans KR",sans-serif;font-size:clamp(1.15rem,5.4vw,1.9rem);line-height:1.45;text-align:center;max-width:20em;word-break:keep-all;animation:biText 1s .35s both}
.bi-boss{position:absolute;bottom:calc(12% + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:6px;animation:biText .8s 2.3s both}
.bi-port{width:104px;height:104px}
.bi-name{font-family:"Gowun Batang",serif;font-weight:700;font-size:1.05rem;text-align:center}
.bi-name small{display:block;font-family:"IBM Plex Sans KR",sans-serif;font-weight:500;font-size:.75rem;color:#6a7288}
.bi-skip{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom,0px));font-size:.72rem;color:#8a92a6;animation:biText .5s 1.4s both}
@keyframes biIn{from{opacity:0}}
@keyframes biText{from{opacity:0;transform:translateY(10px)}}
@keyframes biEmb{from{opacity:0;transform:translate(-50%,-50%) scale(.92) rotate(-8deg)}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bintro{background:linear-gradient(180deg,#1a1f2d,#10131c);color:#eef1f8}:root:not([data-theme="light"]) .bintro::before{background:repeating-linear-gradient(180deg,rgba(255,255,255,.03) 0 2px,transparent 2px 6px)}}
:root[data-theme="dark"] .bintro{background:linear-gradient(180deg,#1a1f2d,#10131c);color:#eef1f8}
:root[data-theme="dark"] .bintro::before{background:repeating-linear-gradient(180deg,rgba(255,255,255,.03) 0 2px,transparent 2px 6px)}
@media (prefers-reduced-motion:reduce){.bintro,.bintro *{animation:none!important}}
.lives{display:inline-flex;gap:3px;vertical-align:middle}
.lives i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--bad,#c0392b);display:block}
.lives i.on{background:var(--bad,#c0392b)}
.warnbox{border-color:var(--bad,#c0392b)!important}
.namebox{display:block;width:100%;margin-top:6px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:1rem}
.choice.diff.picked,.choice.race.picked{border-color:var(--gold);border-left-color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,var(--panel2))}
.portrait{width:96px;height:96px;flex:none;display:block}
.efig{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:start}
.efig .einfo{min-width:0}
.cport{width:52px;height:52px;display:block}
svg.silh{filter:brightness(0);opacity:.28}
.upg.ic{grid-template-columns:52px 1fr auto}
.choice.has-ic{position:relative;padding-left:74px;min-height:72px}
.choice .ricon{position:absolute;left:14px;top:14px;width:46px;height:46px}
.choice .ricon.big{width:50px;height:50px;left:12px;top:11px}
.hitfx{animation:hitk .3s ease-out}
.lunge{animation:lunge .22s ease-out}
.btn.pressed{transform:scale(.97);filter:brightness(1.1)}
@keyframes hitk{0%{transform:translateX(0);filter:brightness(1.8) saturate(.6)}25%{transform:translateX(-5px)}55%{transform:translateX(4px)}100%{transform:none;filter:none}}
@keyframes lunge{0%{transform:none}45%{transform:translateY(4px) scale(1.06)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.hitfx,.lunge{animation:none}}
@media (max-width:420px){.portrait{width:80px;height:80px}.efig{grid-template-columns:80px 1fr}}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script>
'use strict';
/* =========================================================
   정수의 탑 — 2차 버전
   몬스터·정수·보스·이벤트·업그레이드는 상단 데이터 테이블에 있다.
   새 몬스터는 M(...) 한 줄을 추가하면 몬스터·정수·도감에 함께 등록된다.
   ========================================================= */
const SAVE_KEY='essence-tower-save-v1';          // 캐릭터 도입 전 저장 (자동 이전)
const ROOT_KEY='essence-tower-accounts-v1';
const MAX_CHARS=6;
const MAX_DEATHS=5;               // 이 횟수만큼 사망하면 캐릭터 소멸
/* ---------- 난이도 (캐릭터 생성 시 선택, 변경 불가) ---------- */
const DIFFS={
  easy:{name:'아주 쉬움',desc:'몬스터가 조금 약하고 목숨이 하나 더 있습니다. 그래도 방심하면 쓰러집니다.',hp:.85,atk:.85,def:.9,elite:-.04,drop:1.15,lives:6,stone:1.1,cost:.9,

  surt:{frag:{title:'들불',text:'수르트는 사슬에서 풀려난 불의 끝이다. 불은 빼앗겨서도, 풀려나서도 안 된다. 누군가 곁에서 지켜야 한다. 프로메테우스처럼, 사슬에 묶인 채로.'},ac:'#e0501a',motto:'무스펠의 문이 열리고, 세계를 태울 검이 들렸도다.',

/* ---------- 정수 가치 보정 ----------
   정수는 귀한 만큼 강하다. 정의된 수치에 아래 배율을 한 번 적용한다. */
const ESS_VALUE={stat:1.6,passive:1.4,chance:1.25,active:1.25};
(function boostEssences(){
  const r1=v=>Math.round(v*10)/10;
  for(const e of Object.values(ESSENCES)){
    for(const k in e.stats){const v=e.stats[k];if(v>0)e.stats[k]=Math.max(1,Math.round(v*ESS_VALUE.stat))}
    e.passives=e.passives.map(p=>{const q=Object.assign({},p);
      if(q.type==='revive'){q.pct=Math.min(.8,Math.round(q.pct*1.2*100)/100);return q}
      if(q.type==='epStart'||q.type==='epRegen'||q.type==='epOnDodge'){q.amt=q.type==='epStart'?Math.ceil(q.amt*ESS_VALUE.passive):q.amt;}
      else{if(typeof q.pct==='number')q.pct=r1(q.pct*ESS_VALUE.passive);if(typeof q.amt==='number')q.amt=Math.round(q.amt*ESS_VALUE.passive)}
      if(typeof q.chance==='number')q.chance=Math.min(.9,Math.round(q.chance*ESS_VALUE.chance*100)/100);
      if(q.type==='counter'||q.type==='extraAttack')q.mult=Math.round(q.mult*ESS_VALUE.active*100)/100;
      if(q.type==='onHit'&&q.status!=='stun')q.stacks=Math.ceil(q.stacks*ESS_VALUE.active);
      return q});
    if(e.active){const a=e.active=Object.assign({},e.active);
      if(a.mult)a.mult=Math.round(a.mult*ESS_VALUE.active*100)/100;
      if(a.heal)a.heal=Math.round(a.heal*ESS_VALUE.active);
      if(a.shieldPct)a.shieldPct=Math.round(a.shieldPct*ESS_VALUE.active);
      if(a.shieldDef)a.shieldDef={m:r1(a.shieldDef.m*ESS_VALUE.active),f:Math.round(a.shieldDef.f*ESS_VALUE.active)};
      if(a.goldGain)a.goldGain=Math.round(a.goldGain*ESS_VALUE.active);
      if(a.apply)a.apply=a.apply.map(([st,n,c])=>[st,st==='stun'?n:Math.ceil(n*ESS_VALUE.active),c===undefined?c:Math.min(.95,Math.round(c*ESS_VALUE.chance*100)/100)]);}
  }
})();

function rnd(){let a=S.rng=(S.rng+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}
function dbg(s){DEBUG.unshift(s);if(DEBUG.length>120)DEBUG.pop()}
function pct(p){const v=Math.round(p*1000)/10;return v+'%'}
function roll(label,p){const r=rnd(),ok=r<p;dbg(`${label}: 난수 ${r.toFixed(4)} < ${pct(p)} → ${ok?'성공':'실패'}`);return ok}
function rval(label){const r=rnd();dbg(`${label}: 난수 ${r.toFixed(4)}`);return r}
function rint(label,a,b){const r=rnd(),v=a+Math.floor(r*(b-a+1));dbg(`${label}: 난수 ${r.toFixed(4)} → ${v}`);return v}
function pick(label,arr){const tot=arr.reduce((a,x)=>a+x.w,0),r=rnd();let t=r*tot,acc=0;for(const x of arr){acc+=x.w;if(t<acc){dbg(`${label}: 난수 ${r.toFixed(4)} → ${x.label}`);return x}}return arr[arr.length-1]}

function newP(){return {onHit:[],retaliate:[],lifesteal:0,regen:0,regenPct:0,lowHp:null,counterChance:0,counterMult:0,guardShield:0,guardEp:0,
  extraChance:0,extraMult:0,amp:{burn:0,poison:0,bleed:0},poisonExtra:0,goldFind:0,immune:{},startShield:0,firstStrike:0,execute:null,
  epStart:0,epRegen:0,thorns:0,dmgReduce:0,bossDmg:0,killHeal:0,rampage:null,pierce:0,critStun:0,stoneFind:0,revive:0,critHeal:0,
  statusDmg:0,hpAtk:0,veil:0,epOnDodge:0}}
function addPassive(P,p,eff){
  const x=v=>v*eff;
  switch(p.type){
    case 'onHit':P.onHit.push(p);break;
    case 'retaliate':P.retaliate.push(p);break;
    case 'lifesteal':P.lifesteal+=x(p.pct);break;
    case 'regen':P.regen+=Math.round(x(p.amt));break;
    case 'regenPct':P.regenPct+=x(p.pct);break;
    case 'lowHp':if(!P.lowHp||x(p.pct)>P.lowHp.pct)P.lowHp={th:p.th,pct:x(p.pct)};break;
    case 'counter':P.counterChance+=p.chance;P.counterMult=Math.max(P.counterMult,p.mult);break;
    case 'guardShield':P.guardShield=Math.max(P.guardShield,p.mult);break;
    case 'guardEp':P.guardEp+=p.amt;break;
    case 'extraAttack':P.extraChance+=p.chance;P.extraMult=Math.max(P.extraMult,p.mult);break;
    case 'dotAmp':P.amp[p.s]+=x(p.pct);break;
    case 'poisonExtra':P.poisonExtra+=p.stacks;break;
    case 'goldFind':P.goldFind+=x(p.pct);break;
    case 'immune':for(const s of p.s)P.immune[s]=true;break;
    case 'startShield':P.startShield+=x(p.pct);break;
    case 'firstStrike':P.firstStrike+=x(p.pct);break;
    case 'execute':P.execute={th:Math.max(p.th,P.execute?P.execute.th:0),pct:(P.execute?P.execute.pct:0)+x(p.pct)};break;
    case 'epStart':P.epStart+=p.amt;break;
    case 'epRegen':P.epRegen+=p.amt;break;
    case 'thorns':P.thorns+=x(p.pct);break;
    case 'dmgReduce':P.dmgReduce+=x(p.pct);break;
    case 'bossDmg':P.bossDmg+=x(p.pct);break;
    case 'killHeal':P.killHeal+=x(p.pct);break;
    case 'rampage':if(!P.rampage||x(p.pct)>P.rampage.pct)P.rampage={pct:x(p.pct),max:Math.max(p.max,P.rampage?P.rampage.max:0)};break;
    case 'pierce':P.pierce+=x(p.pct);break;
    case 'critStun':P.critStun+=p.chance;break;
    case 'stoneFind':P.stoneFind+=p.chance;break;
    case 'revive':P.revive=Math.max(P.revive,p.pct);break; // 부활은 REVIVE_MIN_GRADE 이상 정수에만 배치
    case 'critHeal':P.critHeal+=x(p.pct);break;
    case 'statusDmg':P.statusDmg+=x(p.pct);break;
    case 'hpAtk':P.hpAtk+=x(p.pct);break;
    case 'veil':P.veil+=p.n;break;
    case 'epOnDodge':P.epOnDodge+=p.amt;break;
  }
}
function pStats(){

    for(const [k,v] of Object.entries(e.stats||{}))s[k]+=v<0?v:Math.round(v*eff);

    r.floor+=1;r.note='';r.abyss={depth:0,since:r.floor};r.abyssIntro=true;S.meta.abyss.visits++;

function turnStart(side){

function advance(){

    const who=c.player.gauge>=c.enemy.gauge?'p':'e';
    unit(who).gauge-=100;
    const r=turnStart(who);
    if(checkEnd())return;
    if(r==='skip')continue;
    if(who==='p'){c.awaiting=true;c.turn++;return}
    if(attackMs()>0){c.pendingEnemy=true;return}
    enemyAct();

function turnPreview(n){

  while(out.length<n){while(pg<100&&eg<100){pg+=ps;eg+=es}if(pg>=eg){out.push('p');pg-=100}else{out.push('e');eg-=100}}

function genRewards(boss){
  const pool=REWARDS.slice(),out=[];
  while(out.length<3&&pool.length){const i=rint('보상 후보 선택',0,pool.length-1);const rw=pool.splice(i,1)[0];
    const o={id:rw.id,q:rewardQ(S.run.floor)*(boss?2:1)};if(rw.id==='gold')o.amount=Math.round((15+S.run.floor*4)*(boss?2:1));out.push(o)}
  return out;
}
function rewardVals(o){const q=o.q;return {heal:30*Math.min(2,o.q>=2?2:1),atk:Math.round(2*q),def:Math.round(2*q),hp:Math.round(10*q),spd:Math.max(1,Math.round(q/1.5)),crit:4,potion:q>=2?2:1,gold:o.amount}}
function rewardText(o){
  const v=rewardVals(o),b=REWARDS.find(x=>x.id===o.id);
  const map={heal:`HP ${v.heal}% 회복`,atk:`공격력 +${v.atk} (이번 등반)`,def:`방어력 +${v.def} (이번 등반)`,hp:`최대 HP +${v.hp}, HP ${v.hp} 회복 (이번 등반)`,
    spd:`속도 +${v.spd} (이번 등반)`,crit:`치명타 확률 +${v.crit}% (이번 등반)`,potion:`회복 물약 +${v.potion}`,gold:`골드 +${v.gold}`};
  return {name:b.name,desc:map[o.id]};
}
function takeReward(i){
  const r=S.run,o=r.rewardOpts&&r.rewardOpts[i];if(!o)return;const v=rewardVals(o),ps=pStats();
  switch(o.id){
    case 'heal':healP(Math.round(ps.maxHp*v.heal/100));break;
    case 'atk':r.buffs.atk+=v.atk;break;

}

const BASIC={attack:{desc:'피해 100%, 기력 +1'},smash:{desc:'피해 170%, 방어 30% 무시'},guard:{desc:'다음 턴까지 받는 피해 50%, 기력 +2'}};
function playerAct(kind,arg){
  const c=C();if(!c||!c.awaiting||c.over)return;
  const u=c.player,ps=pStats();
  if(kind==='attack'){c.awaiting=false;hit('p','e',1,{label:'기본 공격'});u.ep=Math.min(10,u.ep+1);afterPlayerAttack()}
  else if(kind==='smash'){if(u.ep<3)return;c.awaiting=false;u.ep-=3;const mj=hasRelic('mjolnir');const d=hit('p','e',1.7*(mj?1.5:1),{label:mj?'묠니르 강타':'강타',pierce:.3});if(mj&&d>0&&getHp('e')>0&&roll('묠니르 기절',.25))applyStatus('e','stun',1);afterPlayerAttack()}
  else if(kind==='guard'){c.awaiting=false;u.guard=true;u.ep=Math.min(10,u.ep+2+ps.P.guardEp);clog('당신은 방어 자세를 취했다.');
    if(ps.P.guardShield){const v=Math.round(ps.def*ps.P.guardShield);u.shield+=v;clog(`방어막 +${v}`)}}
  else if(kind==='potion'){if(S.run.potions<1)return;c.awaiting=false;S.run.potions--;const h=healSide('p',Math.round(ps.maxHp*.35),'회복 물약');if(!h)clog('HP가 이미 가득하다.')}
  else if(kind==='antidote'){if(S.run.antidotes<1)return;c.awaiting=false;S.run.antidotes--;for(const k in u.st)if(STATUS[k].bad)delete u.st[k];clog('해독제: 해로운 효과를 모두 제거했다.')}
  else if(kind==='ess'){
    const e=ESSENCES[arg];if(!e||!e.active||!ps.eq.includes(arg))return;const a=e.active;if(u.ep<a.ep)return;
    c.awaiting=false;u.ep-=a.ep;clog(`정수 능력: ${a.name}`);
    let landed=!a.mult;
    if(a.mult){for(let i=0;i<(a.hits||1);i++){const r=hit('p','e',a.mult,{label:a.name,crit:a.crit,drain:a.drain,pierce:a.pierce,exec:a.exec});if(r>0)landed=true;if(C().enemy.hp<=0)break}}
    if(landed&&getHp('e')>0)for(const [s,n,ch] of a.apply||[])if(ch===undefined||roll(`${a.name}: ${sn(s)}`,ch))applyStatus('e',s,n);
    if(a.goldGain&&landed){const g=Math.round(a.goldGain*(1+S.run.floor/10));S.run.gold+=g;clog(`골드 ${g}를 빼앗았다.`)}
    if(a.heal)healSide('p',Math.round(ps.maxHp*a.heal/100),a.name);
    if(a.shieldPct){const v=Math.round(ps.maxHp*a.shieldPct/100);u.shield+=v;clog(`방어막 +${v}`)}
    if(a.shieldDef){const v=Math.round(ps.def*a.shieldDef.m+a.shieldDef.f);u.shield+=v;clog(`방어막 +${v}`)}
    for(const [s,n] of a.self||[])applyStatus('p',s,n);
    if(a.mult)afterPlayerAttack();
  }
  else if(kind==='flee'){if(c.boss||S.run.abyss)return;c.awaiting=false;
    if(hasRelic('talaria')||roll('도주',FLEE_CHANCE)){c.over=true;S.run.note='무사히 도망쳤습니다. 보상은 없습니다.';floorCleared(0);return}
    clog('도주 실패!')}
  else return;
  UI.sub=null;
  if(checkEnd())return;
  advance();
}

function shopBuy(i){

const DELAY_MS={normal:900,fast:400,off:0};

document.addEventListener('click',e=>{
  if(BUSY)return;
  if(e.target.dataset&&e.target.dataset.backdrop){act('closeModal');return}
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const ms=DELAY_MS[SET.delay]??900;
  if(DELAYED[b.dataset.act]&&ms>0&&b.classList.contains('choice')){
    let wait=ms;if(b.classList.contains('boss'))wait=Math.round(ms*1.6);
    BUSY=true;b.classList.add('picked');const box=b.closest('.choices');if(box)box.classList.add('busy');
    b.style.setProperty('--dl',wait+'ms');const w=document.createElement('span');w.className='wait';w.textContent=waitText(b);b.appendChild(w);

  const am=attackMs();

const LN=(d,col,w)=>`<path d="${d}" fill="none" stroke="${OL}" stroke-width="${w+SW*2}" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
const GL=(x,y,r,col)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${col}"/><circle cx="${x}" cy="${y}" r="${r*.45}" fill="#fff" opacity=".8"/>`;

function EYES(x1,x2,y,o={}){
  const r=o.r||2.6,col=o.col;let s='';
  for(const x of [x1,x2]){if(x==null)continue;
    s+=col?GL(x,y,r,col):`<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" stroke="${OL}" stroke-width="1.3"/><circle cx="${x}" cy="${y+.3}" r="${r*.5}" fill="${OL}"/>`}
  if(o.angry!==false&&x1!=null&&x2!=null)s+=`<path d="M${x1-r-1.5} ${y-r-2.2} L${x1+r} ${y-r+.2} M${x2+r+1.5} ${y-r-2.2} L${x2-r} ${y-r+.2}" stroke="${OL}" stroke-width="1.8" stroke-linecap="round"/>`;
  return s;
}
function FLAME(x,y,s,c1='#ff8a2a',c2='#ffd54a'){
  return `<path d="M${x} ${y} q${-7*s} ${-7*s} ${-1*s} ${-18*s} q${2*s} ${6*s} ${5*s} ${7*s} q${1*s} ${-5*s} ${-1*s} ${-9*s} q${9*s} ${7*s} ${3*s} ${20*s}Z" fill="${c1}" stroke="${OL}" stroke-width="1.6" stroke-linejoin="round"/><path d="M${x+.5*s} ${y-1*s} q${-3*s} ${-3*s} 0 ${-8*s} q${4*s} ${4*s} 0 ${8*s}Z" fill="${c2}"/>`;
}

  if(kind==='dark'&&layer==='back')return `<path d="M14 88 Q8 60 22 44 Q18 64 30 70 Q26 50 40 38 Q38 60 50 64 Q56 44 66 40 Q62 60 72 66 Q76 50 86 46 Q90 66 86 88Z" fill="#3b2352" opacity=".55"/>`;
  if(kind==='holy'&&layer==='back')return `<circle cx="50" cy="44" r="36" fill="#fff3b0" opacity=".35"/>`;

function towerStrip(best,here){
  const base=Math.floor(Math.max(0,(here||best)-1)/10)*10;let out='';
  for(let f=base+10;f>base;f--){
    const cls=[f<=best?'done':'',f%10===0?'king':'',S.meta.checkpoints.includes(f)?'cp':'',here===f?'here':''].join(' ');
    out+=`<div class="fl ${cls}"><span>${f}층</span>${f%10===0?'<span>왕</span>':''}</div>`;
  }
  return `<div class="tower" aria-label="탑 진행도">${out}</div>`;
}

  else if(UI.modal==='foe')body=foeBody();
  else if(UI.modal==='ess')body=`<h2 style="margin-bottom:10px">정수 관리</h2>`+essencePanel();
  else if(UI.modal==='start')body=`<h2>시작 층 선택</h2><p class="small muted">체크포인트에서 시작하면 골드를 조금 들고 갑니다.</p><div class="choices" style="margin-top:10px">${S.meta.checkpoints.map(c=>`<button class="btn choice battle" data-act="start" data-arg="${c}"><span class="t">${c}층부터</span><span class="d">${c===1?'처음부터 차근차근':`체크포인트 · 시작 골드 ${40+c*3} · 전투 보상 없이 시작`}</span></button>`).join('')}</div>`;
  else if(UI.modal==='retreat')body=`<h2>귀환할까요?</h2><p>이번 등반을 끝내고 시작 화면으로 돌아갑니다. 마석 ${S.run.stone}과 골드 환산분 ${Math.floor(S.run.gold/30)}을 받습니다. 귀환은 사망 횟수에 포함되지 않습니다.</p><div class="row" style="margin-top:12px">${B('confirmRetreat',null,'귀환하기','primary')}${B('closeModal',null,'계속 오르기')}</div>`;
  else if(UI.modal==='prologue')body=`<h2>정수의 탑</h2>${PROLOGUE.map(t=>`<p class="story">${t}</p>`).join('')}<div class="row" style="margin-top:12px">${B('closeModal',null,'탑으로','primary')}</div>`;
  else if(UI.modal==='unequip'){const id=UI.unequipId,e=ESSENCES[id],n=S.meta.storage[id]||0;
    body=e?`<h2>${e.name}을(를) 해제할까요?</h2><p>한 번 추출기에 넣은 정수는 빼는 순간 <b>사라집니다.</b>${n>1?` 보관함에 남은 같은 정수 ${n-1}개는 그대로 있습니다.`:''}</p><div class="row" style="margin-top:12px">${B('confirmUnequip',null,'해제하고 소멸','danger')}${B('cancelUnequip',null,'취소')}</div>`:''}
  else if(UI.modal==='acceptDeath')body=`<h2>되살리지 않고 보낼까요?</h2><p>${esc(S.name)}의 정수, 마석, 강화가 모두 사라집니다.</p><div class="row" style="margin-top:12px">${B('confirmDeath',null,'영원히 보내기','danger')}${B('closeModal',null,'취소')}</div>`;
  else if(UI.modal==='delchar'){const c=ROOT.chars[UI.delId];body=c?`<h2>${esc(c.name)}을(를) 삭제할까요?</h2><p>이 캐릭터의 정수, 마석, 강화, 도감이 모두 사라지며 되돌릴 수 없습니다.</p><div class="row" style="margin-top:12px">${B('delChar',null,'삭제','danger')}${B('closeModal',null,'취소')}</div>`:''}
  else if(UI.modal==='reset')body=`<h2>모든 캐릭터를 초기화할까요?</h2><p>모든 캐릭터와 진행 상황이 삭제되며 되돌릴 수 없습니다.</p><div class="row" style="margin-top:12px">${B('resetAll',null,'초기화','danger')}${B('closeModal',null,'취소')}</div>`;
  return `<div class="modal" data-backdrop="1"><div class="sheet" role="dialog" aria-modal="true">
    <div class="row between" style="margin-bottom:8px"><span></span>${B('closeModal',null,'닫기','sm ghost')}</div>${body}</div></div>`;
}
function debugPanel(){
  if(!SET.debug||!S)return '';
  return `<div class="debug"><b>디버그: 최근 판정 (최신순) · 난수 상태 ${S.rng}</b>${DEBUG.slice(0,40).map(d=>`<div>${d}</div>`).join('')||'<div>기록 없음</div>'}</div>`;
}

document.addEventListener('input',e=>{if(e.target&&e.target.id==='newName')UI.newName=e.target.value});
ROOT=loadRoot();SET=ROOT.settings;S=ROOT.active?ROOT.chars[ROOT.active]:null;
if(S)postLoad();else UI.screen='chars';
applyTheme();render();pump();

</script>
</body>
</html>
